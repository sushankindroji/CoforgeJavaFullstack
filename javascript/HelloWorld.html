<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Introduction</title>
</head>
<body>
    <h1 style="color: brown;">JavaScript Introduction</h1>
    <hr>

    <script>
        document.write("Hello World from JavaScript");
        document.write("<br>This is a new line");
        document.write("<h2>Hello World Again from JavaScript</h2>");

        // Variable declaration
        let num1, num2, sum;
        let name;

        // Get user input
        name = prompt("Enter your name:");
        num1 = parseInt(prompt("Enter first number:"));
        num2 = parseInt(prompt("Enter second number:"));

        // Calculate sum
        sum = num1 + num2;

        // Output results
        console.log("Sum:", sum);
        console.log("Name:", name);

        // Show result on the page
        document.write("<br>Hello " + name + "<br>");
        document.write("The addition of two numbers is: " + sum);

        // Alerts
        alert("Thank you " + name);
        alert(100 + 300);
    </script>

    <h3>Thank You. HTML</h3>
</body>
</html>
