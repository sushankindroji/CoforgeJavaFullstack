<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Assignment 1 - Name Prompt</title>
</head>
<body>
    <h2>Assignment 1</h2>
    <script>
        // Prompt user for name
        let username = prompt("Please enter your name:");
        
        // Display using document.write
        document.write("<h1>Hello " + username + "!</h1>");
        
        // Show alert
        alert("Hello " + username + "!");
    </script>
</body>
</html>
