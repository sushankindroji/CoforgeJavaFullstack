<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS3 Transformations Demo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f4f4;
            padding: 30px;
            text-align: center;
        }

        h1 {
            border: 2px solid red;
            background-color: mediumspringgreen;
            border-radius: 40px 15px;
            padding: 15px;
            width: 320px;
            margin: 30px auto;
            font-size: 1.5rem;
        }

        /* Square - Scale */
        .square {
            width: 120px;
            height: 120px;
            background-color: yellow;
            border: 5px solid brown;
            color: blue;
            font-size: 1.1rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 40px auto;
            transition: transform 1s ease;
        }

        .square:hover {
            transform: scale(1.8);
        }

        /* Droplet - Rotate 3D */
        .droplet {
            width: 130px;
            height: 130px;
            background-color: mediumaquamarine;
            border: 5px solid blue;
            border-radius: 20% 50%;
            color: red;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 40px auto;
            transition: transform 2.5s ease;
        }

        .droplet:hover {
            transform: rotateX(360deg) rotateY(180deg);
        }

        /* Skew */
        .skew {
            width: 130px;
            height: 130px;
            background-color: pink;
            color: #333;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 40px auto;
            transition: transform 1s ease;
        }

        .skew:hover {
            transform: skewX(45deg);
        }

        /* Translate Example */
        #test {
            width: 180px;
            height: 120px;
            margin: 50px auto;
            transition: transform 1.2s ease;
            border: 3px solid #333;
            border-radius: 10px;
            overflow: hidden;
        }

        #test:hover {
            transform: translate(300px, 30px);
        }

        #test img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>The Scale() Method</h1>
        <div class="square">Web Designing</div>

        <h1>The Rotate() Method (3D)</h1>
        <div class="droplet">Wipro</div>

        <h1>The Skew() Method</h1>
        <div class="skew">CSS3</div>

        <h1>The Translate() Method</h1>
        <div id="test">
            <img src="https://interactive-examples.mdn.mozilla.net/media/examples/firefox-logo.svg" alt="Firefox Logo">
        </div>
    </div>
</body>
</html>
