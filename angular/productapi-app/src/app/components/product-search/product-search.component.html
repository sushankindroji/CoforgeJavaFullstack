<div class="product-search-container">

  <h2>🔍 Product Search</h2>

  <div class="search-bar">

    <input
      type="text"
      placeholder="Search products..."
      [(ngModel)]="searchTerm"
    />

    <button (click)="handleSearch()">
      Search
    </button>

  </div>

  <p *ngIf="message" class="message">
    {{ message }}
  </p>

  <table *ngIf="products.length > 0">

    <thead>
      <tr>
        <th>ID</th>
        <th>Product Name</th>
        <th>Brand</th>
        <th>Made In</th>
        <th>Price</th>
      </tr>
    </thead>

    <tbody>

      <tr *ngFor="let product of products">

        <td>{{ product.pid }}</td>

        <td>{{ product.name }}</td>

        <td>{{ product.brand }}</td>

        <td>{{ product.madein }}</td>

        <td>{{ product.price | currency:'INR':'symbol':'1.0-0' }}</td>

      </tr>

    </tbody>

  </table>

</div>
