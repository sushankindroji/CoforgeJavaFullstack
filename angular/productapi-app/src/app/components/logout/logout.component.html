<div class="logout-container">
  <div class="logout-card">
    <!-- Main Heading -->
    <h1>You are Logged out from PMS</h1>
    
    <!-- Image Container -->
    <div class="image-container">
      <img src="/images/running.png" alt="Log out - See you again soon!">
    </div>
    
    <!-- Thank You Message -->
    <h2>Thank You for Using Our Application</h2>
    
    <!-- Action Buttons -->
    <div class="action-buttons">
      <button class="action-btn btn-primary" routerLink="/login">
        <span class="btn-icon">🔐</span>
        <span class="btn-text">Login Again</span>
      </button>
      
      <button class="action-btn btn-secondary" routerLink="/">
        <span class="btn-icon">🏠</span>
        <span class="btn-text">Go to Homepage</span>
      </button>
    </div>
    
    <!-- Footer Message -->
    <div class="footer-message">
      <p>We hope to see you again soon!</p>
      <p>Your session has been securely terminated.</p>
      <p>🔒 All your data is safe and secure</p>
    </div>
  </div>
</div>
