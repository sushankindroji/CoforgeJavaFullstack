<div class="contact-container">

  <h2>📩 Contact Us</h2>

  <form #contactForm="ngForm">

    <!-- Name -->
    <div class="form-group">
      <label for="name">Name</label>

      <input
        type="text"
        id="name"
        name="name"
        [(ngModel)]="pname"
        placeholder="Enter your name"
        required
        minlength="2"
        #name="ngModel">

      <div class="error-message"
           *ngIf="name.invalid && (name.dirty || name.touched)">
        <small *ngIf="name.errors?.['required']">
          Name is required.
        </small>
        <small *ngIf="name.errors?.['minlength']">
          Name must be at least 2 characters.
        </small>
      </div>

    </div>

    <!-- Email -->
    <div class="form-group">

      <label for="email">Email</label>

      <input
        type="email"
        id="email"
        name="email"
        [(ngModel)]="pemail"
        placeholder="Enter your email"
        required
        email
        #email="ngModel">

      <div class="error-message"
           *ngIf="email.invalid && (email.dirty || email.touched)">
        <small *ngIf="email.errors?.['required']">
          Email is required.
        </small>
        <small *ngIf="email.errors?.['email']">
          Enter a valid email.
        </small>
      </div>

    </div>

    <!-- Message -->
    <div class="form-group">

      <label for="message">Message</label>

      <textarea
        id="message"
        name="message"
        rows="5"
        [(ngModel)]="pmessage"
        placeholder="Enter your message"
        required
        minlength="10"
        #message="ngModel"></textarea>

      <div class="error-message"
           *ngIf="message.invalid && (message.dirty || message.touched)">
        <small *ngIf="message.errors?.['required']">
          Message is required.
        </small>
        <small *ngIf="message.errors?.['minlength']">
          Message must be at least 10 characters.
        </small>
      </div>

    </div>

    <button
      type="button"
      [disabled]="contactForm.invalid"
      (click)="onSubmit()">
      Submit
    </button>

  </form>

  <div class="result" *ngIf="submittedData">

    <h3>Submitted Data</h3>

    <p><strong>Name:</strong> {{submittedData.name}}</p>

    <p><strong>Email:</strong> {{submittedData.email}}</p>

    <p><strong>Message:</strong> {{submittedData.message}}</p>

  </div>

</div>
